## Phase 2 Implementation Notes

### When to Implement

Implement this workflow only after Phase 1 is validated successfully in sprint tenant.

**Phase 1 → Phase 2 Checklist:**
1. [✓] Setup.tsx supports "Lookup Table" data source
2. [✓] Sample lookup table tested in sprint tenant
3. [✓] Overview.tsx renders identically for tags and lookups
4. [✓] queryBuilder correctly routes queries
5. [ ] CMDB API endpoint available (Phase 2)
6. [ ] CMDB API credentials obtained (Phase 2)
7. [ ] Lookup table schema finalized (Phase 2)
8. [ ] Workflow deployed and tested (Phase 2)

### CMDB API Requirements

This workflow assumes a CMDB API endpoint that returns:

```json
{
  "result": [
    {
      "sys_id": "...",
      "cmdb_ci_key": "app_identifier",
      "name": "Application Name",
      "business_criticality": "Business Critical|Business Essential|Business Standard",
      "owned_by": "Team Name",
      "business_unit": "Business Unit"
    }
  ]
}
```

**Adapt** the `transform_to_lookup_schema` task if your CMDB API returns different fields.

### Lookup Table Schema

The target Dynatrace lookup table must be created with these columns:

```
Table Name: applications
Key Column: app_id
Columns:
  - app_id (string, key)
  - app_name (string)
  - tier (string)
  - owner (string)
  - business_unit (string)
  - last_sync (datetime)
```

### Error Handling

The workflow includes:
- Field validation before upload
- API timeout handling
- Failure notifications (Slack + Email)
- Idempotent design (safe to re-run)

If sync fails, the lookup table retains the previous data (no data loss).

### Monitoring

After deployment, monitor:
1. Workflow execution status (Success/Failure rate)
2. Records synced per run (trend over time)
3. Data freshness (last_sync column)
4. Query performance (check if lookup queries are slow)

### Performance Considerations

- **Hourly frequency:** Adjustable in workflow trigger
- **Batch size:** Current design replaces entire table (scalable to ~100k rows)
- **Query performance:** DQL lookup queries remain fast (<1s) with proper indexing

---

## Phase 2 Final Architecture

```
CMDB API
  ↓ (Hourly, via Dynatrace Workflow)
  ↓ Fetch + Transform
  ↓
Dynatrace Lookup Table "applications"
  ↓
Setup Wizard (User selects "Lookup Table" data source)
  ↓ Specifies table name: "applications"
  ↓ Maps columns: app_id→appTag, app_name→appName, etc.
  ↓
Overview Page (Identical visualization code to Phase 1)
  ↓ queryBuilder routes to lookupAdapter
  ↓ lookupAdapter generates lookup query
  ↓
DQL Query Execution
  ↓ fetch data from table "applications"
  ↓ Project user-defined columns
  ↓
Table Render (ZERO CHANGES from Phase 1)
```

This proves the entire architecture is scalable and maintainable.
