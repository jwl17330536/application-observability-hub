name: Application Observability Hub - CMDB Sync (Phase 2)
description: Syncs application data from CMDB API to Dynatrace lookup table hourly

# TEMPLATE for Phase 2 implementation
# This workflow is not active in Phase 1
# Phase 1.5 validates the adapter pattern without needing this workflow

trigger:
  schedule:
    interval: 3600 # Run hourly

tasks:
  - id: fetch_cmdb_applications
    name: Fetch Applications from CMDB API
    description: |
      Fetches application data from CMDB via REST API.
      Example: ServiceNow API, custom CMDB REST endpoint, etc.
    
    action: http_request
    config:
      method: GET
      url: "{{ cmdb_api_url }}/api/applications"
      headers:
        Authorization: "Bearer {{ cmdb_api_token }}"
        Accept: application/json
      timeout: 30s
      
    # Output schema expected from CMDB API:
    # {
    #   "result": [
    #     {
    #       "sys_id": "a9a7d5c1234567890abcdef123456789",
    #       "name": "Jira",
    #       "cmdb_ci_key": "jira-prod",
    #       "short_name": "JIRA",
    #       "business_criticality": "Business Critical",
    #       "owned_by": "Platform Team",
    #       "business_unit": "Engineering"
    #     },
    #     ...
    #   ]
    # }
  
  - id: transform_to_lookup_schema
    name: Transform CMDB Data to Lookup Table Schema
    description: |
      Transforms CMDB API response into lookup table column format:
      - app_id (from cmdb_ci_key)
      - app_name (from name)
      - tier (from business_criticality)
      - owner (from owned_by)
    
    action: javascript
    config:
      script: |
        // Input: CMDB API response (previous task output)
        const cmdbData = context.tasks['fetch_cmdb_applications'].output.body.result;
        
        // Transform to lookup table schema
        const lookupData = cmdbData.map(app => ({
          app_id: app.cmdb_ci_key,
          app_name: app.name,
          tier: app.business_criticality,
          owner: app.owned_by,
          business_unit: app.business_unit,
          last_sync: new Date().toISOString()
        }));
        
        // Validation: Ensure all required fields are present
        const requiredFields = ['app_id', 'app_name', 'tier', 'owner'];
        const valid = lookupData.every(row =>
          requiredFields.every(field => row[field] != null && row[field] !== '')
        );
        
        if (!valid) {
          throw new Error('Lookup data validation failed: missing required fields');
        }
        
        return {
          records: lookupData,
          count: lookupData.length,
          timestamp: new Date().toISOString()
        };
  
  - id: update_lookup_table
    name: Upload to Dynatrace Lookup Table
    description: |
      Uploads transformed data to Dynatrace lookup table "applications".
      Replaces entire table on each sync (idempotent).
    
    action: dynatrace_api
    config:
      endpoint: "https://{{ dynatrace_environment }}/api/v2/lookup-tables/applications/update"
      method: POST
      headers:
        Authorization: "Api-Token {{ dynatrace_api_token }}"
        Content-Type: application/json
      
      payload:
        # Schema must match table definition
        # Column: app_id (key), app_name, tier, owner, business_unit, last_sync
        entries: "{{ context.tasks['transform_to_lookup_schema'].output.records }}"
      
      timeout: 60s
  
  - id: notify_sync_complete
    name: Send Sync Status Notification
    description: Notifies about sync completion

    action: notification
    config:
      title: "Application Observability Hub - CMDB Sync"
      message: |
        ✅ CMDB sync completed successfully
        
        - Records synced: {{ context.tasks['transform_to_lookup_schema'].output.count }}
        - Timestamp: {{ context.tasks['transform_to_lookup_schema'].output.timestamp }}
        - Lookup table: applications
        - Next sync: In 1 hour
      
      channels:
        - slack:
            channel: "#observability-alerts"
        - email:
            recipients: ["platform-team@company.com"]

# Error handling
on_error:
  - id: notify_sync_failed
    name: Send Failure Notification
    
    action: notification
    config:
      title: "⚠️ Application Observability Hub - CMDB Sync FAILED"
      message: |
        CMDB sync failed at {{ context.current_task }}.
        
        Error: {{ context.error.message }}
        
        Manual action required:
        1. Check CMDB API connectivity
        2. Verify API credentials in Dynatrace settings
        3. Review workflow logs
        4. Lookup table was NOT updated
      
      channels:
        - slack:
            channel: "#observability-alerts"
        - email:
            recipients: ["platform-team@company.com"]

# Configuration variables (set in Dynatrace)
variables:
  cmdb_api_url:
    type: string
    description: "CMDB API base URL (e.g., https://cmdb.company.com/api)"
    required: true
  
  cmdb_api_token:
    type: secret
    description: "CMDB API authentication token"
    required: true
  
  dynatrace_environment:
    type: string
    description: "Dynatrace environment URL (e.g., abc123.sprint.apps.dynatracelabs.com)"
    required: true
  
  dynatrace_api_token:
    type: secret
    description: "Dynatrace API token (requires storage:files:write scope)"
    required: true

